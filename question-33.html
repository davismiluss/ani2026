<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Question 3 | Access Terminal</title>
    <meta
      name="description"
      content="A private puzzle sequence with locked question pages and one final download."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="question-page">
      <section class="question-layout" aria-labelledby="question-title">
        <button
          class="image-trigger"
          type="button"
          data-lightbox-image="assets/photos/photo-3.svg"
          aria-label="Open image preview"
        >
          <img src="assets/photos/photo-3.svg" alt="Question 3 clue image" />
          <span>Inspect image</span>
        </button>
        <article
          class="question-card"
          data-question
          data-step="2"
          data-next="question-4.html"
        >
          <p class="system-kicker">CHECKPOINT 03 // ALIAS SCAN</p>
          <h1 id="question-title">What do I always call you?</h1>
          <p>
            The system is looking for a tiny alias with unusually high signal.
          </p>
          <form class="unlock-form" autocomplete="off">
            <label for="answer-3">Access phrase</label>
            <input id="answer-3" name="answer" type="text" placeholder="type answer..." required />
            <button class="button button--submit" type="submit">Submit</button>
            <p class="feedback" role="status"></p>
          </form>
          <a
            class="button button--locked reveal-action"
            href="question-444.html"
            aria-disabled="true"
            tabindex="-1"
          >
            Next page locked
          </a>
        </article>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
