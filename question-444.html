<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jautājums 4 | Terminālis</title>
    <meta
      name="description"
      content="A private puzzle sequence with locked question pages and one final download."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="question-page">
      <section class="question-layout" aria-labelledby="question-title">
        <button
          class="image-trigger"
          type="button"
          data-lightbox-image="assets/photos/photo-4.svg"
          aria-label="Open image preview"
        >
          <img src="assets/photos/photo-4.svg" alt="Question 4 clue image" />
          <span>Apskatīt attēlu</span>
        </button>
        <article class="question-card" data-question data-step="3">
          <p class="system-kicker">CHECKPOINT 04 // FINAL HANDSHAKE</p>
          <h1 id="question-title">What year did forever start feeling real?</h1>
          <p>
            Final verification. Enter the year and the payload becomes
            available.
          </p>
          <form class="unlock-form" autocomplete="off">
            <label for="answer-4">Piekļuves kods</label>
            <input id="answer-4" name="answer" type="text" placeholder="type answer..." required />
            <button class="button button--submit" type="submit">Iesniegt</button>
            <p class="feedback" role="status"></p>
          </form>
          <a
            class="button button--locked reveal-action"
            data-gift-link
            href="gift/put-gift-file-here.txt"
            download
            aria-disabled="true"
            tabindex="-1"
          >
            Lejupielāde slēgta
          </a>
        </article>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
