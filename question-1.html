<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Question 1 | Access Terminal</title>
    <meta
      name="description"
      content="A private puzzle sequence with locked question pages and one final download."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="question-page">
      <section class="question-layout" aria-labelledby="question-title">
        <button
          class="image-trigger"
          type="button"
          data-lightbox-image="assets/photos/photo-1.svg"
          aria-label="Open image preview"
        >
          <img src="assets/photos/photo-1.svg" alt="Question 1 clue image" />
          <span>Inspect image</span>
        </button>
        <article class="question-card" data-question data-step="0" data-next="question-2.html">
          <p class="system-kicker">CHECKPOINT 01 // ORIGIN TRACE</p>
          <h1 id="question-title">Where did our story begin?</h1>
          <p>
            The first coordinate matters. Enter the place that started the whole
            sequence.
          </p>
          <form class="unlock-form" autocomplete="off">
            <label for="answer-1">Access phrase</label>
            <input id="answer-1" name="answer" type="text" placeholder="type answer..." required />
            <button class="button button--submit" type="submit">Submit</button>
            <p class="feedback" role="status"></p>
          </form>
          <a class="button button--locked reveal-action" href="question-2.html" aria-disabled="true">
            Next page locked
          </a>
        </article>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
