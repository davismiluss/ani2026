<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pirmais Jautājums | Terminālis</title>
    <meta
      name="description"
      content="A private puzzle sequence with locked question pages and one final download."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="question-page">
      <section class="question-layout" aria-labelledby="question-title">
        <button
          class="image-trigger"
          type="button"
          data-lightbox-image="assets/photos/PXL_20260803_143007960.jpg"
          aria-label="Open image preview"
        >
          <img src="assets/photos/PXL_20260803_143007960.jpg" alt="Question 1 clue image" />
          <span>Apskatīt attēlu</span>
        </button>
        <article class="question-card" data-question data-step="0" data-next="question-x2.html">
          <p class="system-kicker">PIRMAI PUNKTS // PIRMSĀKUMS</p>
          <h1 id="question-title">Atrodi atšķirību</h1>
          <p>
            Iesākumā tāds iesildošs uzdevums.
          </p>
          <form class="unlock-form" autocomplete="off">
            <label for="answer-1">Piekļuves kods</label>
            <input id="answer-1" name="answer" type="text" placeholder="type answer..." required />
            <button class="button button--submit" type="submit">Iesniegt</button>
            <p class="feedback" role="status"></p>
          </form>
          <a
            class="button button--locked reveal-action"
            href="question-x2.html"
            aria-disabled="true"
            tabindex="-1"
          >
           Lapa slēgta
          </a>
        </article>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
